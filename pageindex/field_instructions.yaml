field_instructions:
  "10%预付款": "请从合同中提取与预付款的金额、百分比、付款条件、付款节点、付款比例、付款时间相关的原文条款，输出合同原文中相关完整条款段落。"
  "20%投料款": "请从合同中提取与投料款的金额、百分比、付款条件、付款节点、付款比例、付款时间相关的原文条款，输出合同原文中相关完整条款段落。"
  "20%进度款": "请从合同中提取与进度款的金额、百分比、付款条件、付款节点、付款比例、付款时间相关的原文条款，输出合同原文中相关完整条款段落。"
  "30%发货款": "请从合同中提取与发货款的付款条件、付款节点、付款比例、付款时间相关的原文条款，输出合同原文中相关完整条款段落。"
  "10%初步验收通过款": "请从合同中提取与机组初步验收、可靠性运行或性能试验通过之后应支付的款项的金额、付款条件、付款节点、付款比例、付款时间相关的原文条款，输出合同原文中相关完整条款段落。"
  "10%保证期满后的付款": "请从合同中提取与机组保证期满后应支付的款项的金额、付款条件、付款节点、付款比例、付款时间相关的原文条款，输出合同原文中相关完整条款段落。"
  "技术服务费": "请提取合同中关于技术服务费金额、计费方式、封顶价格及据实结算的原文内容，如“技术服务费用如何计算及调整”，实际服务数量变化、费用增减规则及支付原则的全部内容。"
  "运输及保险费": "请提取合同中关于运输费、保险费及相关承担责任及风险等相关条款。"
  "出国预付款": "请提取合同中关于出国预付款金额、比例及支付节点等相关条款。"
  "出国实际款": "请提取合同中关于出国实际款金额、比例及结算方式或者描述“出国服务完成后支付剩余费用”的相关条款。"
  "培训费": "请提取合同中关于培训费金额、支付方式及培训内容的原文内容。"
  "交货地点": "从合同文本中提取“交货地点”字段，设备实际交付的具体地点如工程现场、车板交货等原文表述。"
  "收货单位": "查找合同中“收货人/收货单位/接收方”"
  "设备交货计划": "请从合同中提取设备交货计划或里程碑，摘出燃机本体交货、就位时间节点等相关事时间信息"
  "设备提前交货处理": "请提取合同中关于”提前交货“的约定，包括触发条件、双方责任及处理方式等。"
  "设备迟交货处理": "提取合同中关于设备延期交付的处罚机制，包括每周违约金比例及封顶条件、时间分段及合同终止条件等"
  "技术资料邮寄地址": "识别合同中关于技术文件/资料发送的具体地址或收件单位相关原文。"
  "技术资料交付": "提取合同中技术文件提交规范（时间节点、纸质份数、电子版格式及接收单位）、关于技术资料提供义务的详细约定（周期、数量、PDF格式等）。"
  "资料迟交货处理": "提取技术资料迟交的违约金计算方式，包括计费单位（图纸/图号）及金额，技术文件延期交付处罚规则，包括罚金标准、计算周期、封顶比例。"
  "性能验收试验": "提取合同中关于性能验收试验完成与初步验收证书签署之间的流程与时间约束。"
  "初步验收证书": "提取初步验收证书签发条件，包括机组稳定运行时长及性能验收延误的时间限制、初步验收证书触发机制及签署时限（如30天内会签）、初步验收证书的签发规则（运行要求、延误条件及双方签署流程）。"
  "最终验收": "提取合同中最终验收条件，包括时间触发机制（36个月）及视为验收的情形、最终验收证书签署条件及双方会签要求（包括买方未完成试运行的情况）、关于最终验收自动通过机制及卖方持续性能责任的条款。"
  "质保期": "提取合同中质保期定义，包括起算时间（初步验收或最后一批到货）及期限长度、识别设备质保期规则（2年或36个月两种条件触发）及适用范围，抽取合同中关于质保期起算点、持续时间及公用设备同步质保的规定。"
  "性能罚款": "从合同中提取“性能违约赔偿条款”，包括出力、热耗率、排放、噪声、振动等各项指标对应的分项罚款、上限比例等。"
  "迟交货罚款": "提取合同中关于设备迟交的违约金计算规则，包括分阶段比例（例如1–4周、5–8周、9周以上等）、迟交货处罚机制及其时间分档、比例递增和不足一周处理规则、迟交货违约责任条款，包括罚款计算方式、累计上限及合同解除条件。"
  "迟交资料罚款": "提取合同中技术资料迟交的违约金规则，包括按图纸/图号计费及每周金额标准，因技术资料错误、不完整或技术服务问题导致工期延误的违约责任及赔偿比例，合同中技术资料及技术服务造成的安装延误罚款、停运赔偿及质保期责任。"
  "可靠性运行延误": "在合同中检索与可靠性运行或运行延误相关的违约责任条款并提取内容。"
  "服务罚款": "提取服务质量相关罚则，包括安装延误罚款比例、停运日罚金及设备损坏赔偿责任。"
  "罚款封顶": "提取合同中各类违约金的累计上限规则，包括性能、交货、资料及总封顶比例，违约责任的总金额限制条款（如10%、15%等分项及整体上限），关于违约金封顶机制及其适用范围（交货、性能、资料等分类限制）。"
  "付款罚款": "提取合同中买方迟付货款的违约金计算规则，包括分阶段比例（1–4周、4周以上），付款延迟的罚则机制，包括按迟付金额比例计算及不足一周处理规则，关于买方付款违约责任及违约金累计上限（如5%）的条款。"
  "保险": "从合同中提取关于运输保险的范围与条件，包括保险金额比例及受益人设定。"
  "保险公司": "识别合同中是否指定保险公司或保险机构等相关信息"
  "履约保函": "提取合同中履约保函相关要求。"
  "预付款保函": "识别合同中是否有预付款保函相关信息"
  "服务内容": "请在合同中搜集卖方服务范围相关描述"
  "服务人员": "请在合同中提取卖方派遣服务人员的要求，可能包括经验要求、年限、专业能力、现场职责、现场支持、培训责任等相关条款"
  "服务周期和报价": "提取合同中服务的周期、起止时间、服务费用及封顶金额（如不封顶，请搜索相关描述），费用的支付机制、服务量及对应价格、超额服务是否计费、未满额是否做价格调整等相关信息"
  "合同生效": "提取合同中的生效条件，包括但不限于生效所需提交的材料、签字生效或者需要执行的动作"
  "合同争议解决方式": "提取合同中对于争议的处理机制，包括第三方机构裁定、责任未确认时的临时处理及规则、费用垫付等相关信息"
  "供应商短名单": "此部分在技术协议中，可列入二阶段的解读内容"
